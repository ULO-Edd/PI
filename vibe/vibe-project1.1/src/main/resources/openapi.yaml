openapi: 3.0.3
info:
  title: Events REST API - ESTG / IPLeiria
  description: API for managing academic and social events at ESTG / IPLeiria.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
paths:
  /events:
    get:
      summary: List events
      operationId: listEvents
      tags:
        - events
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EventStatus'
        - name: organiserId
          in: query
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A list of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
    post:
      summary: Create an event
      operationId: createEvent
      tags:
        - events
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized

  /events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Get event details
      operationId: getEvent
      tags:
        - events
      responses:
        '200':
          description: Event details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Event not found
    put:
      summary: Update an event
      operationId: updateEvent
      tags:
        - events
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdate'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '403':
          description: Forbidden - Only organiser or admin can update
        '404':
          description: Event not found
    delete:
      summary: Cancel/Delete an event
      operationId: deleteEvent
      tags:
        - events
      security:
        - basicAuth: []
      responses:
        '204':
          description: Event cancelled/deleted
        '403':
          description: Forbidden

  /events/{id}/registrations:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      summary: Register for an event
      operationId: registerForEvent
      tags:
        - registrations
      security:
        - basicAuth: []
      responses:
        '201':
          description: Registered successfully
        '400':
          description: Event full or already registered
        '404':
          description: Event not found

  /events/{id}/registrations/me:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      summary: Unregister from an event
      operationId: unregisterFromEvent
      tags:
        - registrations
      security:
        - basicAuth: []
      responses:
        '204':
          description: Unregistered successfully
        '404':
          description: Registration not found

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    EventStatus:
      type: string
      enum: [DRAFT, PUBLISHED, CANCELLED]
    
    Event:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        location:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        organiserId:
          type: integer
          format: int64
        capacity:
          type: integer
        status:
          $ref: '#/components/schemas/EventStatus'
        currentRegistrations:
          type: integer

    EventCreate:
      type: object
      required: [title, startTime, endTime, capacity]
      properties:
        title:
          type: string
        description:
          type: string
        location:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        capacity:
          type: integer

    EventUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        location:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        capacity:
          type: integer
        status:
          $ref: '#/components/schemas/EventStatus'

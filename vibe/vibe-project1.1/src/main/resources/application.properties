spring.application.name=events-api
server.servlet.context-path=/
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# H2 Configuration
spring.datasource.url=jdbc:h2:file:./data/eventsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# API Base Path (for controllers)
# Note: The context-path is / so we'll use /api/v1 in RequestMapping if needed,
# but the generated code should handle it if defined in openapi.yaml.
# Let's check the generated code's @RequestMapping.

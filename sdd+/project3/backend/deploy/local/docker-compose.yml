services:
  postgres:
    image: postgres:15-alpine
    container_name: admin-portal-db
    env_file:
      - .env.postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - admin-portal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  identity-service:
    build:
      context: ../../src/Services/IdentityService
      dockerfile: Dockerfile
    container_name: identity-service
    env_file:
      - .env.identity
    networks:
      - admin-portal-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  events-service:
    build:
      context: ../../src/Services/EventsService
      dockerfile: Dockerfile
    container_name: events-service
    env_file:
      - .env.events
    networks:
      - admin-portal-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  registrations-service:
    build:
      context: ../../src/Services/RegistrationsService
      dockerfile: Dockerfile
    container_name: registrations-service
    env_file:
      - .env.registrations
    networks:
      - admin-portal-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    image: nginx:alpine
    container_name: admin-portal-gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - admin-portal-network
    depends_on:
      identity-service:
        condition: service_healthy
      events-service:
        condition: service_healthy
      registrations-service:
        condition: service_healthy

networks:
  admin-portal-network:
    driver: bridge

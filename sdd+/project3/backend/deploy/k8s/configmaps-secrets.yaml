apiVersion: v1
kind: ConfigMap
metadata:
  name: backbone-config
data:
  RabbitMQ__HostName: "rabbitmq"
  RabbitMQ__Port: "5672"
  RabbitMQ__UserName: "guest"
  RabbitMQ__Password: "guest"
  RabbitMQ__QueueName: "analytics-queue"
  NotificationApi__BaseUrl: "https://api.notifications.example.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: backbone-secrets
type: Opaque
stringData:
  RabbitMQ__Password: "guest"
  NotificationApi__ApiKey: "prod-api-key-secret-999"
  DeadLetterDb__ConnectionString: "Data Source=/data/deadletter.db"

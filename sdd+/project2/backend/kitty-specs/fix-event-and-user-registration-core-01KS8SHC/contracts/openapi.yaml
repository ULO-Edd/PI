openapi: 3.0.3
info:
  title: Event Management Core API
  version: 1.0.0
  description: Core endpoints for user registration, event management, and registration validations.

paths:
  /register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum: [attendee, organiser, administrator]
              required: [username, password, role]
      responses:
        '201':
          description: User created successfully
        '400':
          description: Invalid input or role
        '409':
          description: Username already taken

  /login:
    post:
      summary: Authenticate a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required: [username, password]
      responses:
        '200':
          description: Successfully authenticated, returns JWT token
        '401':
          description: Invalid credentials

  /events:
    get:
      summary: List and search events
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: organiser_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of events

    post:
      summary: Create a new event (Organiser or Admin)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                location:
                  type: string
                start_time:
                  type: string
                  format: date-time
                end_time:
                  type: string
                  format: date-time
                capacity:
                  type: integer
              required: [title, start_time, end_time, capacity]
      responses:
        '201':
          description: Event created as Draft

  /events/{eventId}:
    get:
      summary: Get event details
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event retrieved successfully
        '404':
          description: Event not found

    put:
      summary: Update event details (Organiser or Admin)
      security:
        - BearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                location:
                  type: string
                start_time:
                  type: string
                  format: date-time
                end_time:
                  type: string
                  format: date-time
                capacity:
                  type: integer
                status:
                  type: string
                  enum: [draft, published, cancelled]
      responses:
        '200':
          description: Event updated successfully
        '403':
          description: Forbidden - not your event
        '404':
          description: Event not found

    delete:
      summary: Delete event (Organiser or Admin)
      security:
        - BearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Event deleted successfully
        '403':
          description: Forbidden - not your event
        '404':
          description: Event not found

  /events/{eventId}/register:
    post:
      summary: Register for a published event (Attendee)
      security:
        - BearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Registration successful
        '400':
          description: Bad request (e.g., registering for draft/cancelled event)
        '409':
          description: Already registered or event at full capacity

    delete:
      summary: Unregister from an event (Attendee)
      security:
        - BearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Unregistered successfully
        '404':
          description: Registration not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

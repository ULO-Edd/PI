openapi: 3.0.0
info:
  title: Event Management API
  version: 1.0.0
  description: API for managing events, users, and registrations at ESTG/IPLeiria.

paths:
  /events:
    get:
      summary: List and search for events
      responses:
        '200':
          description: A list of events.
    post:
      summary: Create a new event (Organisers/Admins only)
      responses:
        '201':
          description: Event created successfully.

  /events/{eventId}:
    get:
      summary: Get details of a specific event
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event details.
    put:
      summary: Update an event (Organiser/Admin only)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event updated successfully.
    delete:
      summary: Cancel an event (Organiser/Admin only)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Event cancelled successfully.

  /events/{eventId}/register:
    post:
      summary: Register for an event (Attendees only)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Registration successful.

  /events/{eventId}/unregister:
    delete:
      summary: Unregister from an event (Attendees only)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Unregistration successful.

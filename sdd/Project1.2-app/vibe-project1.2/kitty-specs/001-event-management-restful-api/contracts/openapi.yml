openapi: 3.0.0
info:
  title: Event Management API
  description: API for managing events at ESTG / IPLeiria.
  version: 1.0.0

paths:
  /token:
    post:
      summary: Get JWT token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
                - username
                - password
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          description: Invalid credentials

  /users/:
    post:
      summary: Create a new user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input

  /events/:
    get:
      summary: List all published events
      tags: [Events]
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Search term to filter events by title or description
      responses:
        '200':
          description: A list of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
    post:
      summary: Create a new event (Organiser or Admin)
      tags: [Events]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'

  /events/{event_id}:
    get:
      summary: Get event by ID
      tags: [Events]
      parameters:
        - in: path
          name: event_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Event details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Event not found
    put:
      summary: Update an event (Organiser or Admin)
      tags: [Events]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: event_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdate'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '403':
          description: Not authorized to update this event
        '404':
          description: Event not found
    delete:
      summary: Delete an event (Organiser or Admin)
      tags: [Events]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: event_id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Event deleted
        '403':
          description: Not authorized to delete this event
        '404':
          description: Event not found

  /events/{event_id}/register:
    post:
      summary: Register for an event
      tags: [Events]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: event_id
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Successfully registered
        '400':
          description: Event is full or registration failed
        '404':
          description: Event not found
  /events/{event_id}/unregister:
    delete:
      summary: Unregister from an event
      tags: [Events]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: event_id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Successfully unregistered
        '400':
          description: User was not registered for this event
        '404':
          description: Event not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Token:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string

    UserCreate:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [attendee, organiser, admin]

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
          enum: [attendee, organiser, admin]

    EventCreate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        location:
          type: string
        start_datetime:
          type: string
          format: date-time
        end_datetime:
          type: string
          format: date-time
        capacity:
          type: integer
        status:
          type: string
          enum: [draft, published, cancelled]

    EventUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        location:
          type: string
        start_datetime:
          type: string
          format: date-time
        end_datetime:
          type: string
          format: date-time
        capacity:
          type: integer
        status:
          type: string
          enum: [draft, published, cancelled]

    Event:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        location:
          type: string
        start_datetime:
          type: string
          format: date-time
        end_datetime:
          type: string
          format: date-time
        capacity:
          type: integer
        status:
          type: string
          enum: [draft, published, cancelled]
        organiser_id:
          type: integer

    Registration:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        event_id:
          type: integer
        timestamp:
          type: string
          format: date-time
